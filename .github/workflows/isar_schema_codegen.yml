name: Isar reference schema generation

on:
  push:
    branches:
      - refactor/riverpod-architecture
    paths:
      - .github/isar-codegen-request

permissions:
  contents: write

concurrency:
  group: isar-codegen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and commit Isar schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          ref: refactor/riverpod-architecture
          persist-credentials: true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Isar models
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify generated HistoryRef collection
        shell: bash
        run: |
          test -s lib/database/models/models.g.dart
          grep -q 'HistoryRefSchema' lib/database/models/models.g.dart
          git diff --stat -- lib/database/models/models.g.dart
      - name: Commit generated Isar code only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/database/models/models.g.dart
          if git diff --cached --quiet; then
            echo "Generated model unchanged."
          else
            git commit -m "build(isar): generate HistoryRef Isar collection schema"
            git push origin HEAD:refactor/riverpod-architecture
          fi
