name: Migration quality checks

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/riverpod-architecture
    paths:
      - .github/ci-checkpoint

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: migration-dependency-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No committed Flutter tests found yet; skipping test execution."
          fi

      - name: Commit resolved dependency lock
        if: success()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- pubspec.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f pubspec.lock
            git commit -m "chore(deps): commit resolved dependency lock"
            git push
          else
            echo "pubspec.lock is already up to date."
          fi
