name: Five-platform build gate

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/riverpod-architecture
    paths:
      - .github/full-build-checkpoint

permissions:
  contents: read

concurrency:
  group: full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - platform: linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - platform: windows
            os: windows-latest
            command: flutter build windows --debug
          - platform: macos
            os: macos-latest
            command: flutter build macos --debug
          - platform: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libjson-glib-dev libkeybinder-3.0-dev libmpv-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Enable desktop target
        if: matrix.platform == 'linux'
        run: flutter config --enable-linux-desktop

      - name: Enable desktop target
        if: matrix.platform == 'windows'
        run: flutter config --enable-windows-desktop

      - name: Enable desktop target
        if: matrix.platform == 'macos'
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build ${{ matrix.platform }}
        if: matrix.platform != 'macos'
        run: ${{ matrix.command }}

      - name: Build macos without CI signing
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            flutter build macos --debug --config-only
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
